<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 560" role="img" aria-labelledby="title description">
  <title id="title">Dutch bank help search architecture</title>
  <desc id="description">Fictional Dutch help content flows through LLM enrichment, indexing, hybrid BM25 and vector retrieval with RRF, evaluation, and monitoring. Elasticsearch and pure Python offline backends share the retrieval interface.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#176b70"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" x2="1">
      <stop offset="0" stop-color="#e8f5f3"/>
      <stop offset="1" stop-color="#f1f8fa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b7185"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#19334a" flood-opacity=".10"/>
    </filter>
    <style>
      .title { font: 700 25px Arial, sans-serif; fill: #fff; }
      .subtitle { font: 14px Arial, sans-serif; fill: #d9eeec; }
      .step { font: 700 12px Arial, sans-serif; letter-spacing: 1px; fill: #527084; }
      .card-title { font: 700 18px Arial, sans-serif; fill: #142d42; }
      .body { font: 14px Arial, sans-serif; fill: #425b6e; }
      .small { font: 12px Arial, sans-serif; fill: #607789; }
      .backend-title { font: 700 14px Arial, sans-serif; fill: #17364a; }
      .backend-body { font: 13px Arial, sans-serif; fill: #486174; }
      .badge { font: 700 11px Arial, sans-serif; letter-spacing: .6px; }
    </style>
  </defs>

  <rect width="1660" height="560" rx="22" fill="#f4f7fa"/>
  <rect x="24" y="20" width="1612" height="78" rx="16" fill="url(#header)"/>
  <text x="54" y="55" class="title">Dutch bank help search</text>
  <text x="54" y="79" class="subtitle">From fictional content to measured, monitored retrieval</text>
  <rect x="1380" y="43" width="218" height="32" rx="16" fill="#ffffff" fill-opacity=".16"/>
  <text x="1489" y="64" text-anchor="middle" class="subtitle">ONE OFFLINE SWITCH</text>

  <g transform="translate(38 142)">
    <text x="0" y="0" class="step">01 · SOURCE</text>
    <rect x="0" y="18" width="220" height="206" rx="15" fill="#fff" stroke="#dce6ed" filter="url(#shadow)"/>
    <rect x="0" y="18" width="220" height="7" rx="4" fill="#3975a8"/>
    <circle cx="30" cy="57" r="15" fill="#e9f1f8"/>
    <path d="M23 52h14M23 57h14M23 62h10" stroke="#3975a8" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="98" class="card-title">Fictional content</text>
    <text x="22" y="128" class="body">40 Dutch help pages</text>
    <text x="22" y="151" class="body">25 judged queries</text>
    <text x="22" y="184" class="small">Private + business topics</text>
  </g>

  <g transform="translate(310 142)">
    <text x="0" y="0" class="step">02 · ENRICH</text>
    <rect x="0" y="18" width="220" height="206" rx="15" fill="#fff" stroke="#dce6ed" filter="url(#shadow)"/>
    <rect x="0" y="18" width="220" height="7" rx="4" fill="#8264b5"/>
    <circle cx="30" cy="57" r="15" fill="#f1edfa"/>
    <path d="M30 47l2.6 6.4L39 56l-6.4 2.6L30 65l-2.6-6.4L21 56l6.4-2.6z" fill="#8264b5"/>
    <text x="22" y="98" class="card-title">LLM enrichment</text>
    <text x="22" y="128" class="body">Two-sentence summaries</text>
    <text x="22" y="151" class="body">Controlled metadata</text>
    <rect x="18" y="174" width="184" height="30" rx="8" fill="#f5f2fb"/>
    <text x="110" y="194" text-anchor="middle" class="small">Validate labels + numbers</text>
  </g>

  <g transform="translate(582 142)">
    <text x="0" y="0" class="step">03 · INDEX</text>
    <rect x="0" y="18" width="220" height="206" rx="15" fill="#fff" stroke="#dce6ed" filter="url(#shadow)"/>
    <rect x="0" y="18" width="220" height="7" rx="4" fill="#13847b"/>
    <circle cx="30" cy="57" r="15" fill="#e7f5f2"/>
    <path d="M22 50h16v15H22zM26 46h16v15" fill="none" stroke="#13847b" stroke-width="2" stroke-linejoin="round"/>
    <text x="22" y="98" class="card-title">Search index</text>
    <text x="22" y="128" class="body">Dutch-analyzed BM25</text>
    <text x="22" y="151" class="body">E5 vectors · 384 dims</text>
    <rect x="18" y="174" width="184" height="30" rx="8" fill="#eaf6f4"/>
    <text x="110" y="194" text-anchor="middle" class="small">Title + summary vectors</text>
  </g>

  <g transform="translate(854 142)">
    <text x="0" y="0" class="step">04 · RETRIEVE</text>
    <rect x="0" y="18" width="220" height="206" rx="15" fill="url(#highlight)" stroke="#9acdc7" filter="url(#shadow)"/>
    <rect x="0" y="18" width="220" height="7" rx="4" fill="#087e78"/>
    <circle cx="30" cy="57" r="15" fill="#d5eeea"/>
    <path d="M21 58h7l4-8 4 16 4-8h6" fill="none" stroke="#087e78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="98" class="card-title">Hybrid search</text>
    <text x="22" y="128" class="body">BM25 + vector kNN</text>
    <text x="22" y="151" class="body">RRF combines rankings</text>
    <rect x="18" y="174" width="184" height="30" rx="8" fill="#d9f0ec"/>
    <text x="110" y="194" text-anchor="middle" class="small">Optional audience rerank</text>
  </g>

  <g transform="translate(1126 142)">
    <text x="0" y="0" class="step">05 · EVALUATE</text>
    <rect x="0" y="18" width="220" height="206" rx="15" fill="#fff" stroke="#dce6ed" filter="url(#shadow)"/>
    <rect x="0" y="18" width="220" height="7" rx="4" fill="#d28b32"/>
    <circle cx="30" cy="57" r="15" fill="#fbf2e6"/>
    <path d="M22 64V54h5v10M30 64V48h5v16M38 64V43h5v21" fill="none" stroke="#c47b20" stroke-width="2" stroke-linejoin="round"/>
    <text x="22" y="98" class="card-title">Evaluation</text>
    <text x="22" y="128" class="body">RR · AP · nDCG@10</text>
    <text x="22" y="151" class="body">Recall@10 · 25 queries</text>
    <rect x="18" y="174" width="184" height="30" rx="8" fill="#fcf5eb"/>
    <text x="110" y="194" text-anchor="middle" class="small">Slice by need + segment</text>
  </g>

  <g transform="translate(1398 142)">
    <text x="0" y="0" class="step">06 · MONITOR</text>
    <rect x="0" y="18" width="220" height="206" rx="15" fill="#fff" stroke="#dce6ed" filter="url(#shadow)"/>
    <rect x="0" y="18" width="220" height="7" rx="4" fill="#bd5961"/>
    <circle cx="30" cy="57" r="15" fill="#faecee"/>
    <path d="M30 45l11 19H19z" fill="none" stroke="#ad4852" stroke-width="2" stroke-linejoin="round"/>
    <path d="M30 51v6M30 60v1" stroke="#ad4852" stroke-width="2" stroke-linecap="round"/>
    <text x="22" y="98" class="card-title">Monitoring</text>
    <text x="22" y="128" class="body">Quality + response time</text>
    <text x="22" y="151" class="body">Errors + stale content</text>
    <rect x="18" y="174" width="184" height="30" rx="8" fill="#fbf0f1"/>
    <text x="110" y="194" text-anchor="middle" class="small">Privacy + fairness checks</text>
  </g>

  <g fill="none" stroke="#5b7185" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M260 266h39"/>
    <path d="M532 266h39"/>
    <path d="M804 266h39"/>
    <path d="M1076 266h39"/>
    <path d="M1348 266h39"/>
  </g>

  <rect x="582" y="408" width="492" height="102" rx="14" fill="#eaf0f5" stroke="#cedae3"/>
  <text x="606" y="435" class="step">SAME SEARCH INTERFACE · SELECTED BY USE_OFFLINE</text>
  <rect x="600" y="452" width="220" height="40" rx="9" fill="#fff" stroke="#d7e0e8"/>
  <text x="710" y="469" text-anchor="middle" class="backend-title">Elasticsearch</text>
  <text x="710" y="485" text-anchor="middle" class="small">Dutch analyzer · kNN · server RRF</text>
  <rect x="836" y="452" width="220" height="40" rx="9" fill="#fff" stroke="#d7e0e8"/>
  <text x="946" y="469" text-anchor="middle" class="backend-title">Pure Python fallback</text>
  <text x="946" y="485" text-anchor="middle" class="small">rank_bm25 · NumPy · client RRF</text>
  <path d="M692 408v-48" stroke="#95a8b7" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <path d="M964 408v-48" stroke="#95a8b7" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <text x="54" y="526" class="small">Fictional data only · E5 query/passage prefixes · scores and segment boosts remain inspectable</text>
</svg>
