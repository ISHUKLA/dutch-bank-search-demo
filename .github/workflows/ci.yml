name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-offline:
    runs-on: ubuntu-latest
    env:
      USE_OFFLINE: "true"
      HF_HUB_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore the public E5 model cache
        id: e5-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: e5-multilingual-small-${{ runner.os }}-v1
      - name: Download E5 when the cache is empty
        if: steps.e5-cache.outputs.cache-hit != 'true'
        env:
          HF_HUB_OFFLINE: "false"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -e .
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('intfloat/multilingual-e5-small')"
      - name: Install dependencies from the lock-style requirements file
        if: steps.e5-cache.outputs.cache-hit == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -e .
      - name: Run all tests with the Elasticsearch-free backend
        run: python -m pytest -q
